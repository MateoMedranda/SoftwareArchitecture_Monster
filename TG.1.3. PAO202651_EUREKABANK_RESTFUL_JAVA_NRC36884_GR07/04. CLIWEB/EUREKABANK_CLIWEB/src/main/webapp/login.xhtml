<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"><h:head><title>EUREKABANK RESTFUL · Ingreso</title><h:outputStylesheet library="css" name="eureka.css"/></h:head><h:body styleClass="login-page"><main class="login-card"><div class="brand"><h:graphicImage library="img" name="logo.png" styleClass="brand-logo"/><span class="logo-fallback">◆</span><div><b>EUREKABANK RESTFUL</b><small>Cliente web · API RESTful</small></div></div><section><h1>Tu dinero, en movimiento.</h1><p>Ingresa para consultar y operar tus cuentas con tranquilidad.</p><h:form styleClass="login-form"><h:outputLabel for="user" value="Usuario"/><h:inputText id="user" value="#{sesionBean.usuario}" required="true" styleClass="field"/><h:outputLabel for="pass" value="Contraseña"/><h:inputSecret id="pass" value="#{sesionBean.contrasenia}" required="true" styleClass="field"/><h:outputText value="#{sesionBean.mensaje}" rendered="#{not empty sesionBean.mensaje}" styleClass="alert error"/><h:commandButton value="Ingresar a mi banca" action="#{sesionBean.iniciar}" styleClass="primary"/></h:form></section><footer>Protegido por sesiones JWT · API RESTful</footer></main></h:body></html>
