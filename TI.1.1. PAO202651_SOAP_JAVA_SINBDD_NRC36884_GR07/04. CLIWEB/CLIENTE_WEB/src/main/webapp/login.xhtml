<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Login - Conversor de Unidades</title>
    <h:outputStylesheet name="css/estilos.css"/>
</h:head>
<h:body>

    <div class="login-wrapper">
        <div class="login-card">

            <div class="imagen-espacio">
                <p:graphicImage name="img/logo.png" alt="Logo"/>
            </div>

            <h2 class="login-titulo">Conversor unidades</h2>

            <h:form id="formLogin">

                <!-- Usuario -->
                <div class="campo">
                    <p:outputLabel for="usuario" value="Usuario"/>
                    <p:inputText id="usuario"
                                 value="#{loginBean.credenciales.usuario}"
                                 placeholder="Ingrese su usuario"/>
                </div>

                <!-- Contrasenia -->
                <div class="campo">
                    <p:outputLabel for="contrasenia" value="Contrasena"/>
                    <p:password id="contrasenia"
                                value="#{loginBean.credenciales.contrasenia}"
                                placeholder="Ingrese su contrasena"
                                feedback="false"/>
                </div>

                <p:commandButton value="Ingresar"
                                 action="#{loginBean.iniciarSesion}"
                                 ajax="false"
                                 styleClass="boton-login"/>

                <p:messages id="msg" showDetail="true" closable="true"/>
            </h:form>

        </div>
    </div>
</h:body>
</html>
