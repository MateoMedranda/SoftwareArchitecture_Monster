services:
  mysql:
    image: dhi.io/mysql:9-debian-dev
    container_name: eurekabank_mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - red_arquitectura
    restart: unless-stopped

  # La imagen dhi.io/mysql solo configura el usuario root y no procesa
  # /docker-entrypoint-initdb.d. Por eso el modelo y los datos se aplican
  # con contenedores de un solo uso, en ese orden.
  #
  # Paso 1: modelo (base de datos, usuarios y DDL del MER).
  mysql-modelo:
    image: dhi.io/mysql:9-debian-dev
    container_name: eurekabank_mysql_modelo
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: admin
    volumes:
      - ./01-modelo.sql:/scripts/01-modelo.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        export MYSQL_PWD="$$MYSQL_ROOT_PASSWORD"
        echo "Esperando a que MySQL acepte conexiones..."
        until mysqladmin ping -h mysql -uroot --silent; do sleep 2; done
        TABLAS=$$(mysql -h mysql -uroot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='arquitectura_db' AND table_name='USUARIO';")
        if [ "$$TABLAS" -gt 0 ]; then
          echo "El modelo ya existe; se omite 01-modelo.sql."
        else
          echo "Ejecutando 01-modelo.sql (modelo)..."
          mysql -h mysql -uroot < /scripts/01-modelo.sql
          echo "01-modelo.sql ejecutado correctamente."
        fi
    networks:
      - red_arquitectura
    restart: "no"

  # Paso 2: datos iniciales. Solo arranca si el modelo terminó con éxito.
  mysql-datos:
    image: dhi.io/mysql:9-debian-dev
    container_name: eurekabank_mysql_datos
    depends_on:
      mysql-modelo:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: admin
    volumes:
      - ./02-datos.sql:/scripts/02-datos.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        export MYSQL_PWD="$$MYSQL_ROOT_PASSWORD"
        FILAS=$$(mysql -h mysql -uroot -N -e "SELECT COUNT(*) FROM arquitectura_db.USUARIO;")
        if [ "$$FILAS" -gt 0 ]; then
          echo "Los datos ya estan cargados; se omite 02-datos.sql."
        else
          echo "Ejecutando 02-datos.sql (datos)..."
          mysql -h mysql -uroot < /scripts/02-datos.sql
          echo "02-datos.sql ejecutado correctamente."
        fi
    networks:
      - red_arquitectura
    restart: "no"

volumes:
  mysql_data:
    name: eurekabank_mysql_data

networks:
  red_arquitectura:
    name: arquitectura_network
    driver: bridge
